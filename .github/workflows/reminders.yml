# Calls the reminders and auto-confirm job (POST /api/v1/jobs/reminders) every 15 minutes (docs/specs/05-setup-and-env.md).
# Repository secrets: API_URL (e.g. https://plasticash-api.onrender.com, no trailing slash) and CRON_SECRET (same value as
# the API's CRON_SECRET). GitHub may run scheduled jobs a few minutes late; the job is safe to run at any time.
name: Reminders job

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the job
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # --retry covers the free Render instance waking up (it sleeps after 15 idle minutes).
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$API_URL/api/v1/jobs/reminders" -H "X-Cron-Secret: $CRON_SECRET"
