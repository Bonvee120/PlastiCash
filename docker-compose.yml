services:
  api:
    build: ./api
    env_file:
      - path: ./api/.env
        required: false
    ports:
      - "8000:8000"

  # Postgres for pytest only. The app itself uses Supabase.
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plasticash_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plasticash_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Redis for rate limiting and caching (production: Render Key Value). Local only, no password.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

