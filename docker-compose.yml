services:
  # Postgres for pytest only. The app itself uses Supabase.
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plasticash_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plasticash_test"]
      interval: 2s
      timeout: 3s
      retries: 15
